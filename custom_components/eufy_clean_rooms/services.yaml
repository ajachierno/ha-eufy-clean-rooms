clean_rooms:
  target:
    entity:
      integration: eufy_clean_rooms
      domain: vacuum
  fields:
    rooms:
      required: true
      example: '["Living Room", "Kitchen"]'
      selector:
        text:
          multiple: true
    clean_type:
      selector:
        select:
          options: ["vacuum", "mop", "vacuum_and_mop"]
          translation_key: clean_type
    fan_speed:
      selector:
        select:
          options: ["Quiet", "Standard", "Turbo", "Max"]
    mop_level:
      selector:
        select:
          options: ["low", "medium", "high"]
    clean_times:
      default: 1
      selector:
        number:
          min: 1
          max: 3
refresh_rooms:
  target:
    entity:
      integration: eufy_clean_rooms
      domain: vacuum
